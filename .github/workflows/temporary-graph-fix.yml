name: Temporary Statistics Graph Fix

on:
  push:
    branches:
      - ui-layering-fixes-20260822

permissions:
  contents: write

jobs:
  fix-graphs:
    if: ${{ !contains(github.event.head_commit.message, '[graph-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply graph layout fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('idle-water/Scripts/ui/StatisticsGraph.cs')
          s = p.read_text()

          replacements = [
              ('private const float GraphSpacing = 5.0f;', 'private const float GraphSpacing = 15.0f;'),
              ('private const float GraphMarginBottom = 5.0f;', 'private const float GraphMarginBottom = 60.0f;'),
              ('private const float SecondGraphMarginBottom = 50.0f;', 'private const float SecondGraphMarginBottom = 60.0f;'),
              ('private const float GraphBorderWidth = 2.0f;', 'private const float GraphBorderWidth = UiSettings.BorderSize;'),
              ('DrawString(ThemeDB.FallbackFont, new Vector2(graphRect.End.X + 8.0f, graphRect.Position.Y + graphRect.Size.Y * 0.5f), ExistingGraphYAxis, HorizontalAlignment.Left, -1, UiSettings.FontSizeSmall, new Color(0.75f, 0.75f, 0.75f));', 'DrawString(ThemeDB.FallbackFont, new Vector2(graphRect.Position.X - 50.0f, graphRect.Position.Y + graphRect.Size.Y * 0.5f + 7.0f), ExistingGraphYAxis, HorizontalAlignment.Right, 45.0f, UiSettings.FontSizeSmall, new Color(0.75f, 0.75f, 0.75f));'),
              ('// Value is intentionally on the right side of the graph.', '// Value label restored to the left side of the graph.'),
              ('DrawString(ThemeDB.FallbackFont, new Vector2(graphRect.End.X + 8.0f, graphRect.Position.Y + graphRect.Size.Y * 0.5f), RainEnergyGraphYAxis, HorizontalAlignment.Left, -1, UiSettings.FontSizeSmall, new Color(0.75f, 0.75f, 0.75f));', 'DrawString(ThemeDB.FallbackFont, new Vector2(graphRect.Position.X - 50.0f, graphRect.Position.Y + graphRect.Size.Y * 0.5f + 7.0f), RainEnergyGraphYAxis, HorizontalAlignment.Right, 45.0f, UiSettings.FontSizeSmall, new Color(0.75f, 0.75f, 0.75f));'),
              ('// Energy is intentionally on the right. The old bottom "Particles" label is removed.', '// Energy label restored to the left side of the graph.'),
              ('graphRect.End.Y + 14.0f', 'graphRect.End.Y + 24.0f'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source text: {old}')
              s = s.replace(old, new)

          p.write_text(s)
      - name: Commit graph fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add idle-water/Scripts/ui/StatisticsGraph.cs
          git commit -m "fix: finish statistics graph layout [graph-fix]"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/temporary-graph-fix.yml
          git add .github/workflows/temporary-graph-fix.yml
          git commit -m "chore: remove temporary graph fix workflow [graph-fix]"
          git push
